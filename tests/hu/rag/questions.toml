# Questions and answer key for the Hungarian RAG test (tests/hu/rag).
#
# type:     egyszeru (one fact), tobbreszes (two facts, often from two
#           documents), ekezet (typed without accents or with typos),
#           folytatas (a follow-up question; `history` is the earlier turn),
#           nincs (the documents hold no answer), tablazat (from a table)
# split:    tune (used to choose settings) or holdout (looked at only at
#           the end, to check the chosen settings)
# sources:  where the answer is; `quote` is verbatim from the document and
#           is what the search must find. Several entries: all are needed.
#           `doc` may list several files when the same sentence is in each.
#           With `any_source = true`, any one of the entries is enough.
# require:  every entry must be in the answer; "a|b" means a or b
#           (case-insensitive substrings, as in suite.toml). Use stems where
#           a suffix changes the word: "24 ór" matches "24 órán", "24 óra" not.
# forbid:   none of these may be in the answer (usually the value from a
#           similar rule in another document)
#
# Written before any run; the checksum of this file is in README.md.
# Changed after the first run, with the reason:
# - 2026-10-28, t05: require "24 óra" did not match "24 órán belül" (the
#   suffix lengthens a to á), so a right answer counted as wrong. Stems now.

# ---------------------------------------------------------------------------
# One fact

