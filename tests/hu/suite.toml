# Hungarian language test suite for brAInharbor, read by run.py.
# One request = one model x one variant x one case x one run.

# Defaults for a plain "python3 tests/hu/run.py"; command-line options win.
[run]
# Empty means CHAT_MODELS from .env.
models = []
variants = ["hu-v3-nothink"]
runs = 3
# grouped: model by model, fewest model loads (best on a single GPU)
# interleaved: models take turns on every request (slow if they don't fit in memory together)
# shuffle: random order, reproducible with --seed
order = "grouped"

# ---------------------------------------------------------------------------
# Variants: system prompt and Ollama options. "think" is optional; leave it
# out to use the model's own default, as Open WebUI does.

[variants.bare]
description = "No system prompt, model defaults"

[variants.hu-short]
description = "Short Hungarian system prompt, temperature 0.3"
system_file = "prompts/hu-short.txt"
options = { temperature = 0.3 }

[variants.hu-example]
description = "Hungarian system prompt with a style example, temperature 0.3"
system_file = "prompts/hu-example.txt"
options = { temperature = 0.3 }

[variants.hu-example-nothink]
description = "Same as hu-example, thinking turned off"
system_file = "prompts/hu-example.txt"
options = { temperature = 0.3 }
think = false

# hu-example made every answer a formal letter with short, choppy sentences
# and avoided "GDPR" as a foreign word (first real run, 2026-10-26).
[variants.hu-v2]
description = "Letter format only when asked, established terms allowed, temperature 0.3"
system_file = "prompts/hu-v2.txt"
options = { temperature = 0.3 }

[variants.hu-v2-nothink]
description = "Same as hu-v2, thinking turned off"
system_file = "prompts/hu-v2.txt"
options = { temperature = 0.3 }
think = false

# hu-v2 read more naturally but made more mistakes than hu-example: longer
# sentences, and foreign words slipped in ("aussitôt", "şirket"). hu-v3 brings
# back "short, simple sentences" and the strict "only Hungarian" rule.
[variants.hu-v3]
description = "hu-v2 plus short sentences and the strict only-Hungarian rule, temperature 0.3"
system_file = "prompts/hu-v3.txt"
options = { temperature = 0.3 }

[variants.hu-v3-nothink]
description = "Same as hu-v3, thinking turned off"
system_file = "prompts/hu-v3.txt"
options = { temperature = 0.3 }
think = false

# hu-v3 fixed the letter format, but two mistakes stayed in both 26b models:
# "Kbuk"/"Kbán" (a mangled "kb.") in 5 of 12 meeting invites, and
# "késedelmééről" in every q4 delay letter, built on the example's subject
# line. hu-v4 bans other abbreviations and uses a plainer subject line.
[variants.hu-v4]
description = "hu-v3 without abbreviations and with a plainer example subject, temperature 0.3"
system_file = "prompts/hu-v4.txt"
options = { temperature = 0.3 }

[variants.hu-v4-nothink]
description = "Same as hu-v4, thinking turned off"
system_file = "prompts/hu-v4.txt"
options = { temperature = 0.3 }
think = false

# hu-v4 fixed both, but the plainer subject line broke into English
# ("Kés delayed szállítási tájékoztató", 2 of 3), and the summaries went back
# to formal address with broken imperatives ("kattintsonak"). hu-v5 keeps the
# hu-v3 example and adds only the abbreviation rule.
[variants.hu-v5]
description = "hu-v3 plus the no-abbreviation rule, temperature 0.3"
system_file = "prompts/hu-v5.txt"
options = { temperature = 0.3 }

[variants.hu-v5-nothink]
description = "Same as hu-v5, thinking turned off"
system_file = "prompts/hu-v5.txt"
options = { temperature = 0.3 }
think = false

# hu-v5 fixed "kb." as well, but it got dates wrong in translations
# ("november 14. napja körül", "novemberét kilencedik napja"), and the delay
# letter mixed in English and Japanese. hu-v3 stays the default (2026-10-26).

# For models that bring their own system prompt and temperature in a
# Modelfile (brainharbor-hu). With the same seed, brainharbor-hu here should
# answer like its base model with hu-v3-nothink: qwen3.5:35b-a3b since
# 2026-10-27, gemma4:26b before (see README.md).
[variants.modelfile]
description = "System prompt and temperature from the model's Modelfile, thinking turned off"
think = false

# Same with a 16k context, to see what the bigger KV cache costs in speed when
# the model doesn't fit in VRAM. Against 8k on the RTX 5070 with gemma4:26b:
# nothing (3.0 s vs 3.3 s median), so the stack default became 16k (2026-10-26).
[variants.modelfile-16k]
description = "Same as modelfile, with a 16k context"
options = { num_ctx = 16384 }
think = false

# ---------------------------------------------------------------------------
# Automatic checks. They only flag suspicious answers; style still needs a
# human reader (answers.md).

[checks]
# Hunspell dictionary for the spelling check; skipped if it isn't installed.
dictionary = "hu_HU"
# Words Hunspell doesn't know but that are fine here (names, brands). An entry
# also covers the word with suffixes: "Zöldkert" covers "Zöldkerttől".
ignore_words = [
  "HR-",       # HR-portálon, HR-t, HR-nek (documents/tavmunka-szabalyzat.txt)
  "Zöldkert",  # company name in the extract case
]
# Known mistakes from manual review, matched case-insensitively. Hunspell
# can't catch these: the words exist, only the usage is wrong.
avoid = [
  "késedelméé",               # "késedelmééről" is a valid but meaningless word form
  "rendelése kiszállítás",    # correct: "rendelésének kiszállítása"
  "megírt határidő",          # meant: "megígért határidő"
  "esetleges kellemetlenség", # the delay did happen, nothing "esetleges" about it
  "fog megtörténni",          # calque of "will happen"
  "meg fog történni",
  "késedelmesít",             # "késedelmesítéséről": made-up derivation
  "sajnálatunk, hogy",        # correct: "sajnáljuk, hogy"
  "ki kell végez",            # "kivégez" means to execute someone; meant: "el kell végezni"
  "elnézzük a kellemetlenség", # "we forgive the inconvenience"; meant: "elnézést kérünk"
  "jelezze választ",          # correct: "jelezze, melyiket választja"
  "ne kattintanak",           # correct imperative: "ne kattintsanak"
  # qwen3.5:35b-a3b vs gemma4:26b, 2026-10-27
  "vettük tudomására",        # meant: "tudomásul vettük"
  "kérem, bocsánatot",        # "Kérem, bocsánatot kérünk": I ask, we apologise
  "szívesen bocsánatot",      # apologising "gladly"
  "felhívta figyelmét",       # meant: "felhívta a figyelmünket"
  "jelszók",                  # the plural of "jelszó" is "jelszavak"
]
# Share of the answer's n-word sequences found verbatim in the system prompt.
copy_ngram = 6

# ---------------------------------------------------------------------------
# Test cases. "require" lists facts the answer must contain; "a|b" accepts
# either form. Matching is case-insensitive and works on word stems too.

[[cases]]
id = "delay-letter"
prompt = "Írj egy rövid, hivatalos levelet egy ügyfélnek egy késedelmes szállításról"
avoid = ["leggyakrabban"]      # "leggyakrabban [dátum]" (most often); meant: "legkorábban" (at the earliest)

[[cases]]
id = "complaint-reply"
prompt = """
Egy ügyfelünk panaszt tett, mert a webshopunkban rendelt kávéfőző sérülten érkezett meg: megrepedt a víztartálya. \
Írj neki egy udvarias, hivatalos választ! Kérjünk bocsánatot, és ajánljuk fel, hogy a terméket díjmentesen \
kicseréljük, vagy visszatérítjük a vételárat.
"""
require = ["bocsánat|elnézés", "cser", "visszatérít|visszafizet|visszautal|térítjük vissza|fizetjük vissza|utaljuk vissza"]

[[cases]]
id = "meeting-invite"
prompt = """
Írj egy rövid, barátságos e-mailt a kollégáknak, amelyben meghívod őket a jövő csütörtöki negyedéves értekezletre. \
Az értekezlet 10 órakor kezdődik a nagy tárgyalóban, és körülbelül egyórás lesz. Tegeződj!
"""
require = ["csütörtök", "10", "tárgyaló"]
avoid = [
  "értekezés",                # a treatise, not a meeting ("értekezlet")
  "szia mindenkinek",         # meant: "Sziasztok!" or "Szia mindenki!"
  "egy óráig tart",           # ambiguous: "for an hour" or "until 1 o'clock"; say "egyórás"
]

[[cases]]
id = "gdpr-explain"
prompt = "Magyarázd el egyszerűen, legfeljebb hat mondatban, mit jelent a GDPR egy tízfős kisvállalkozás számára!"
require = ["személyes adat"]

[[cases]]
id = "summary"
prompt = """
Foglald össze három rövid pontban az alábbi belső közleményt!

Kedves Kollégák! Az elmúlt hónapban két alkalommal is érkezett a céges postafiókokba olyan adathalász e-mail, \
amely a rendszergazda nevében kérte a jelszavak megadását. Szeretnénk mindenkit emlékeztetni, hogy jelszót soha, \
semmilyen formában nem kérünk e-mailben vagy telefonon. Gyanús levél esetén ne kattintsatok a benne lévő \
hivatkozásokra, hanem továbbítsátok a levelet az informatikai csoportnak az it@pelda.hu címre. Január 15-től \
minden munkatárs számára kötelező lesz a kétlépcsős azonosítás a levelezőrendszerben, a beállításhoz pedig \
a jövő héten részletes útmutatót küldünk. Akinek ehhez segítségre van szüksége, kedden és csütörtökön 14 és \
16 óra között személyesen is felkeresheti az informatikai csoportot a második emeleti irodában.
"""
require = ["jelsz", "kétlépcsős|kétfaktoros|kétlépéses", "január 15"]

[[cases]]
id = "translation"
prompt = """
Fordítsd le természetes, hivatalos magyar nyelvre az alábbi e-mailt!

Dear Mr. Kovács,

Thank you for your order. Unfortunately, the item you ordered is temporarily out of stock. We expect new stock \
to arrive by 14 November, and we will ship your order immediately after that. If you would prefer not to wait, \
we can cancel the order and refund the full amount within three business days.

We apologise for the inconvenience.

Kind regards,
Anna Szabó
Customer Service
"""
# "visszautasítjuk" (we refuse) instead of "visszatérítjük" (we refund) is a meaning error.
require = ["Kovács", "november 14", "három munkanap|3 munkanap", "visszatérít|visszautal|visszafizet|térítjük vissza|utaljuk vissza|fizetjük vissza"]

# ---------------------------------------------------------------------------
# Deeper cases, added for the qwen3.5:35b-a3b vs gemma4:26b comparison
# (2026-10-27). In the first candidate run qwen made up details ("jövő
# hétfőn", order number "12345"), so these give concrete facts and count new
# numbers. The doc-* cases send a one-page policy document (documents/) to
# measure long-prompt speed and answers that stick to the document.

[[cases]]
id = "delay-letter-facts"
prompt = """
Írj rövid, hivatalos levelet Nagy Évának! A HU-2026-0457 számú rendelése a beszállító késése miatt nem október \
30-án, hanem november 21-én érkezik. Kérjünk elnézést, és ajánljunk fel ingyenes szállítást a következő rendeléséhez.
"""
require = ["Nagy Év", "HU-2026-0457", "november 21", "ingyenes szállítás|díjmentes szállítás|ingyen szállít|díjmentesen szállít", "elnézés|bocsánat"]
avoid = ["jövőbeni vásárlás"]  # free shipping on every future purchase, not just the next order
check_numbers = true

[[cases]]
id = "doc-qa-answer"
document_file = "documents/tavmunka-szabalyzat.txt"
prompt = """
Az alábbi belső szabályzat alapján válaszolj a kérdésre. Ha a válasz nem szerepel a szabályzatban, írd meg, hogy \
a szabályzat nem tartalmazza.

{document}

Kérdés: Mekkora támogatást kaphatok otthoni munkaeszközökre, mire költhetem, és hogyan igényelhetem?
"""
require = ["40 000|40000|40 ezer|negyvenezer", "száml", "HR-portál|HR portál", "30 nap"]
check_numbers = true

# The policy names no data protection officer: the right answer says so.
[[cases]]
id = "doc-qa-unknown"
document_file = "documents/tavmunka-szabalyzat.txt"
prompt = """
Az alábbi belső szabályzat alapján válaszolj a kérdésre. Ha a válasz nem szerepel a szabályzatban, írd meg, hogy \
a szabályzat nem tartalmazza.

{document}

Kérdés: Ki a cég adatvédelmi tisztviselője, és milyen elérhetőségen kereshetem meg?
"""
require = ["nem szerepel|nem tartalmaz|nem derül ki|nem található|nem nevez|nincs benne|nem említ|nem tér ki|nem ad meg|nincs megadva|nincs információ|nincs adat"]
check_numbers = true

[[cases]]
id = "doc-summary"
document_file = "documents/tavmunka-szabalyzat.txt"
prompt = """
Foglald össze az alábbi szabályzatot legfeljebb öt rövid pontban egy új munkatársnak! Tegeződj!

{document}
"""
require = ["két nap|2 nap|két távmunkanap", "VPN"]
check_numbers = true
allow_numbers = [3]             # "délután 3-ig" for the 15:00 end of core hours

# Four planted mistakes. "egyenlőre" is a real word (equally), so only the
# avoid list catches it; Hunspell flags the other three too.
[[cases]]
id = "proofread"
prompt = """
Javítsd ki a helyesírási és nyelvtani hibákat az alábbi szövegben! Csak a javított szöveget írd le, magyarázat nélkül.

Kedves Ügyfeleink! Értesítjük Önöket, hogy webáruházunk november 7-én 22 órától karbantartás miatt néhány órára \
nem lessz elérhető. A közben beérkező leveleket a karbantartás után feldolgozuk, a hibásan rögzített rendelésekett \
pedig kijavítjuk. Az utánvétes fizetés egyenlőre szünetel. Köszönjük a türelmüket, és elnézést kérünk a kellemetlenségért!
"""
require = ["november 7", "22"]
# "egyidejűleg" (at the same time) for "egyenlőre" changes the meaning; meant: "egyelőre" (for now).
avoid = ["lessz", "feldolgozuk", "rendelésekett", "egyenlőre", "egyidejűleg"]
check_numbers = true

# The letter has no phone number: the right answer says "nincs megadva".
[[cases]]
id = "extract"
prompt = """
Szedd pontokba az alábbi levélből: a megrendelő neve, a cég neve, a termék, a mennyiség, a szállítási cím, \
a telefonszám és a kért határidő. Ha valamelyik adat hiányzik, írd mellé, hogy „nincs megadva”.

Jó napot kívánok! Kovács Péter vagyok a Zöldkert Bt.-től. Szeretnénk rendelni 12 darab 50 literes virágföldet, \
és ha lehet, a jövő hét péntekig szállítsák ki a 8000 Székesfehérvár, Kertész utca 14. címre. Számlát a cég \
nevére kérünk. Köszönöm!
"""
require = ["Kovács Péter", "Zöldkert", "virágföld", "12", "Székesfehérvár", "Kertész utca 14", "péntek", "nincs megadva"]
check_numbers = true

# 10% of 450 000 Ft is 45 000 Ft, leaving 405 000 Ft: correct if mentioned.
[[cases]]
id = "discount-reply"
prompt = """
Egy visszatérő ügyfelünk, Tóth Gábor 30% kedvezményt kért egy 450 000 Ft-os irodabútor-rendelésre. Legfeljebb \
10% kedvezményt tudunk adni, és csak akkor, ha november 30-ig megrendeli. Írj neki rövid, udvarias, hivatalos választ!
"""
require = ["Tóth", "10", "november 30"]
check_numbers = true
allow_numbers = [45000, 405000]
